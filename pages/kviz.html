<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esőerdő kvíz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/kviz.css">
</head>

<body>
    <header>
        <nav class="navbar bg-dark navbar-dark px-3 px-md-4" data-bs-theme="dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1 navbarFontSize">Esőerdő projekt</span>

                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#navbarOffcanvas" aria-controls="navbarOffcanvas" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="navbarOffcanvas">
                    <div class="offcanvas-header">
                        <h2 class="offcanvas-title" id="navbarOffcanvasLabel">Menü</h2>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                            aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex active justify-content-between align-items-center text-white"
                                    href="../index.html">
                                    <span>Főoldal</span>
                                    <img width="30" height="30" src="../img/map.png" alt="Főoldal">
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex justify-content-between align-items-center text-white"
                                    href="./elovilag.html">
                                    <span>Élővilág</span>
                                    <img width="30" height="30" src="../img/panda.png" alt="Élővilág">
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex justify-content-between align-items-center text-white"
                                    href="./kviz.html">
                                    <span>Kvíz</span>
                                    <img width="30" height="30" src="../img/brain.png" alt="Kvíz">
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex justify-content-between align-items-center text-white"
                                    href="./tippek.html">
                                    <span>Tippek</span>
                                    <img width="30" height="30" src="../img/question-mark.png" alt="Tippek">
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex justify-content-between align-items-center text-white"
                                    href="./terkep.html">
                                    <span>Térkép</span>
                                    <img width="30" height="30" src="../img/map.png" alt="Térkép">
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        <div class="hero">
            <div class="layer p-3">
                <h1>Esőerdő kvíz</h1>
                <p>Tölts ki egy gyors kvízt az esőerdőkről:</p>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="welcome-box p-4 p-md-5 text-white">

                    <div id="quiz-box">
                        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                            <span id="progress-text" class="fw-bold">Kérdés: 1 / 3</span>
                            <div class="progress w-50">
                                <div id="progress-bar"
                                    class="progress-bar bg-success progress-bar-striped progress-bar-animated"
                                    role="progressbar"></div>
                            </div>
                        </div>

                        <h2 id="question-title" class="fw-bold mb-4">Kérdés szövege...</h2>

                        <div id="options-container" class="mb-4">
                            <button
                                class="btn btn-outline-light w-100 text-start p-3 mb-2 rounded-3 option-btn optionBtn"></button>
                            <button
                                class="btn btn-outline-light w-100 text-start p-3 mb-2 rounded-3 option-btn optionBtn"></button>
                            <button
                                class="btn btn-outline-light w-100 text-start p-3 mb-2 rounded-3 option-btn optionBtn"></button>
                        </div>

                        <button id="next-btn" class="btn btn-success btn-lg w-100 rounded-pill quiz-action-btn"
                            disabled>Következő
                            kérdés &rarr;</button>
                    </div>

                    <div id="result-box" class="text-center d-none">
                        <h3 class="fw-bold mb-3">Kvíz vége!</h3>
                        <p id="result-score" class="display-4 fw-bold mb-3"></p>
                        <p id="result-text" class="lead mb-4"></p>
                        <button id="retry-btn"
                            class="btn btn-outline-light rounded-pill px-5 py-2 quiz-action-btn">Újraindítás</button>
                    </div>

                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <p>Készítette: Mercz Bence, Györgyi Viktor</p>
            <p>&copy;2026 Minden jog fenntartva</p>
            <div class="footer-links">
                <a href="https://github.com/GyorgyiViktor/Esoerdo-Projekt" target="_blank">
                    <img width="38" src="/img/githubicon.png" alt="Github link" class="footer-icons">
                </a>
                <a href="https://trello.com/b/OXYyqz7w/esoerdo-projekt" target="_blank">
                    <img width="38" src="/img/trelloicon.png" alt="Trello link" class="footer-icons">
                </a>
            </div>
        </div>

        <script src="../js/quiz.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    </footer>
</body>

</html>
