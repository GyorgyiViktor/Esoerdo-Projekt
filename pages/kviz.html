<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esőerdő kvíz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/kviz.css">
</head>

<body>
    <header>
        <nav class="navbar bg-1 fg-2 px-4" data-bs-theme="dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1 navbarFontSize">Esőerdő projekt</span>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarTogglerDemo02"
                    aria-labelledby="navbarTogglerDemo02Label">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarTogglerDemo02Label">Menü</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex justify-content-between align-items-center text-white"
                                    href="../index.html">
                                    <span>Főoldal</span>
                                    <img width="30px" height="30px" src="../img/map.png" alt="Főoldal">
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex justify-content-between align-items-center text-white"
                                    href="../pages/elovilag.html">
                                    <span>Élővilág</span>
                                    <img width="30px" height="30px" src="../img/panda.png" alt="Élővilág">
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex active justify-content-between align-items-center text-white"
                                    href="../pages/kviz.html">
                                    <span>Kvíz</span>
                                    <img width="30px" height="30px" src="../img/brain.png" alt="Kvíz">
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex justify-content-between align-items-center text-white"
                                    href="../pages/tippek.html">
                                    <span>Tippek</span>
                                    <img width="30px" height="30px" src="../img/question-mark.png" alt="Tippek">
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-flex d-flex justify-content-between align-items-center text-white"
                                    href="./terkep.html">
                                    <span>Térkép</span>
                                    <img width="30px" height="30px" src="../img/map.png" alt="Térkép">
                                </a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>
        <div class="hero">
            <div class="layer p-3">
                <h1>Esőerdő kvíz</h1>
                <p>Tölts ki egy gyors kvízt az esőerdőkről:</p>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="welcome-box p-4 p-md-5 text-white">

                    <div id="quiz-box">
                        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                            <span id="progress-text" class="fw-bold">Kérdés: 1 / 3</span>
                            <div class="progress w-50" style="height: 10px;">
                                <div id="progress-bar" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar"
                                    style="width: 33%;"></div>
                            </div>
                        </div>

                        <h4 id="question-title" class="fw-bold mb-4">Kérdés szövege...</h4>

                        <div id="options-container" class="mb-4">
                        </div>

                        <button id="next-btn" class="btn btn-success btn-lg w-100 rounded-pill quiz-action-btn" disabled>Következő
                            kérdés &rarr;</button>
                    </div>

                    <div id="result-box" class="text-center d-none">
                        <h3 class="fw-bold mb-3">Kvíz vége!</h3>
                        <p id="result-score" class="display-4 fw-bold mb-3"></p>
                        <p id="result-text" class="lead mb-4"></p>
                        <button id="retry-btn" class="btn btn-outline-light rounded-pill px-5 py-2 quiz-action-btn">Újraindítás</button>
                    </div>

                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <p>Készítette: Mercz Bence, Györgyi Viktor</p>
            <p>&copy;2026 Minden jog fenntartva</p>
            <div class="footer-links">
                <a href="https://github.com/GyorgyiViktor/Esoerdo-Projekt" target="_blank">
                    <img width="38px" src="/img/github icon.png" alt="Github link" class="footer-icons">
                </a>
                <a href="https://trello.com/b/OXYyqz7w/esoerdo-projekt" target="_blank">
                    <img width="38px" src="/img/trello icon.png" alt="Github link" class="footer-icons">
                </a>
            </div>
        </div>

        <script src="../js/quiz.js"></script>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
    </footer>
</body>

</html>
